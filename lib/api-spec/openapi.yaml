openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Lead Intelligence Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: campaigns
  - name: campaign-runs
  - name: leads
  - name: lists
  - name: email-accounts
  - name: email-templates
  - name: outreach
  - name: logs
  - name: settings
  - name: dashboard

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Dashboard ────────────────────────────────────────────────
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  # ── Campaigns ────────────────────────────────────────────────
  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      summary: List all campaigns
      responses:
        "200":
          description: List of campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"
    post:
      operationId: createCampaign
      tags: [campaigns]
      summary: Create a campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"

  /campaigns/{id}:
    get:
      operationId: getCampaign
      tags: [campaigns]
      summary: Get a campaign by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "404":
          description: Not found
    patch:
      operationId: updateCampaign
      tags: [campaigns]
      summary: Update a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
    delete:
      operationId: deleteCampaign
      tags: [campaigns]
      summary: Delete a campaign and all its associated data
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /campaigns/{id}/reset-data:
    post:
      operationId: resetCampaignData
      tags: [campaigns]
      summary: Delete all runs and leads for a campaign, keeping the campaign settings
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reset result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetCampaignDataResult"
        "404":
          description: Campaign not found

  # ── Discovery ────────────────────────────────────────────────
  /campaigns/{id}/run-discovery:
    post:
      operationId: runDiscovery
      tags: [campaigns]
      summary: Run web discovery for a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Discovery summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverySummary"
        "400":
          description: Campaign inactive or missing API key
        "404":
          description: Campaign not found

  /campaigns/{id}/trigger:
    post:
      operationId: triggerCampaignPipeline
      tags: [campaigns]
      summary: Manually trigger the full pipeline for a campaign (non-blocking)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "202":
          description: Pipeline started in background
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerResult"
        "404":
          description: Campaign not found
        "409":
          description: Pipeline already running

  /campaigns/{id}/pause:
    patch:
      operationId: pauseCampaign
      tags: [campaigns]
      summary: Pause a campaign scheduler
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"

  /campaigns/{id}/resume:
    patch:
      operationId: resumeCampaign
      tags: [campaigns]
      summary: Resume a paused campaign scheduler
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"

  # ── Campaign Runs ─────────────────────────────────────────────
  /campaign-runs:
    get:
      operationId: listCampaignRuns
      tags: [campaign-runs]
      summary: List campaign runs (optionally filtered by campaign)
      parameters:
        - name: campaignId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of campaign runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CampaignRun"

  /campaign-runs/{id}:
    get:
      operationId: getCampaignRun
      tags: [campaign-runs]
      summary: Get a campaign run by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Campaign run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignRun"
        "404":
          description: Not found
    delete:
      operationId: deleteCampaignRun
      tags: [campaign-runs]
      summary: Delete a campaign run (leads are kept with campaign_run_id nulled)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "400":
          description: Cannot delete a running campaign run
        "404":
          description: Not found

  /campaign-runs/{id}/leads:
    get:
      operationId: getCampaignRunLeads
      tags: [campaign-runs]
      summary: Get all leads discovered in a specific campaign run
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Leads from this run
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"

  # ── Email Templates ───────────────────────────────────────────
  /email-templates:
    get:
      operationId: listEmailTemplates
      tags: [email-templates]
      summary: List all email templates
      parameters:
        - name: includeInactive
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmailTemplate"
    post:
      operationId: createEmailTemplate
      tags: [email-templates]
      summary: Create a template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailTemplateInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailTemplate"

  /email-templates/{id}:
    get:
      operationId: getEmailTemplate
      tags: [email-templates]
      summary: Get a template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailTemplate"
        "404":
          description: Not found
    patch:
      operationId: updateEmailTemplate
      tags: [email-templates]
      summary: Update a template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailTemplatePatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailTemplate"
        "404":
          description: Not found
    delete:
      operationId: deleteEmailTemplate
      tags: [email-templates]
      summary: Delete a template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /email-templates/{id}/preview:
    post:
      operationId: previewEmailTemplate
      tags: [email-templates]
      summary: Preview a template rendered with sample data or a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewTemplateInput"
      responses:
        "200":
          description: Rendered preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewTemplateResult"
        "404":
          description: Not found

  # ── Lists ─────────────────────────────────────────────────────
  /lists:
    get:
      operationId: listLeadLists
      tags: [lists]
      summary: List all lead lists
      parameters:
        - name: campaignId
          in: query
          schema:
            type: integer
        - name: includeArchived
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Lead lists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeadList"
    post:
      operationId: createLeadList
      tags: [lists]
      summary: Create a lead list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadListInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadList"

  /lists/{id}:
    get:
      operationId: getLeadList
      tags: [lists]
      summary: Get a lead list by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lead list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadList"
        "404":
          description: Not found
    patch:
      operationId: updateLeadList
      tags: [lists]
      summary: Update a lead list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadListPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadList"
    delete:
      operationId: deleteLeadList
      tags: [lists]
      summary: Delete a lead list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /lists/{id}/leads:
    get:
      operationId: getListLeads
      tags: [lists]
      summary: Get leads in a list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Leads in list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
    post:
      operationId: addLeadsToList
      tags: [lists]
      summary: Add leads to a list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddLeadsToListInput"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddLeadsToListResult"

  /lists/{id}/leads/{leadId}:
    delete:
      operationId: removeLeadFromList
      tags: [lists]
      summary: Remove a lead from a list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: leadId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /lists/{id}/health:
    get:
      operationId: getListHealth
      tags: [lists]
      summary: Get health and quality summary for a list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List health summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListHealthResponse"

  # ── Scheduler ─────────────────────────────────────────────────
  /scheduler/status:
    get:
      operationId: getSchedulerStatus
      tags: [scheduler]
      summary: Get scheduler status for all campaigns
      responses:
        "200":
          description: Scheduler statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SchedulerStatus"

  # ── Leads ────────────────────────────────────────────────────
  /leads:
    get:
      operationId: listLeads
      tags: [leads]
      summary: List leads (optionally filter by campaign)
      parameters:
        - name: campaignId
          in: query
          schema:
            type: integer
        - name: reviewStatus
          in: query
          schema:
            type: string
        - name: leadStatus
          in: query
          schema:
            type: string
        - name: campaignRunId
          in: query
          schema:
            type: integer
        - name: qualificationStatus
          in: query
          schema:
            type: string
        - name: outreachStatus
          in: query
          schema:
            type: string
        - name: country
          in: query
          schema:
            type: string
        - name: hasEmail
          in: query
          schema:
            type: boolean
        - name: minScore
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
    post:
      operationId: createLead
      tags: [leads]
      summary: Create a lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"

  /leads/{id}:
    get:
      operationId: getLead
      tags: [leads]
      summary: Get a lead by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "404":
          description: Not found
    patch:
      operationId: updateLead
      tags: [leads]
      summary: Update a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
    delete:
      operationId: deleteLead
      tags: [leads]
      summary: Delete a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /leads/bulk-delete:
    post:
      operationId: bulkDeleteLeads
      tags: [leads]
      summary: Delete multiple leads by ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDeleteLeadsInput"
      responses:
        "200":
          description: Deletion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkDeleteLeadsResult"

  /leads/bulk-action:
    post:
      operationId: bulkLeadAction
      tags: [leads]
      summary: Bulk apply a status action to multiple leads
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkActionInput"
      responses:
        "200":
          description: Bulk action result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkActionResult"

  /leads/{id}/notes:
    get:
      operationId: listLeadNotes
      tags: [leads]
      summary: List notes for a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeadNote"
    post:
      operationId: addLeadNote
      tags: [leads]
      summary: Add a note to a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadNoteInput"
      responses:
        "201":
          description: Created note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadNote"

  /leads/{id}/status-history:
    get:
      operationId: getLeadStatusHistory
      tags: [leads]
      summary: Get status change history for a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of status history entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatusHistoryEntry"

  /leads/bulk-score:
    post:
      operationId: bulkScore
      tags: [leads]
      summary: Score multiple leads by ID list or campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkScoreInput"
      responses:
        "200":
          description: Bulk score summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkScoreSummary"

  /leads/{id}/score:
    post:
      operationId: scoreLead
      tags: [leads]
      summary: Score a single lead against campaign objective using AI
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Score result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreResult"

  /leads/bulk-crawl:
    post:
      operationId: bulkCrawl
      tags: [leads]
      summary: Crawl multiple leads by ID list or campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkCrawlInput"
      responses:
        "200":
          description: Bulk crawl summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkCrawlSummary"

  /leads/{id}/run-crawl:
    post:
      operationId: runCrawl
      tags: [leads]
      summary: Crawl a single lead's website and extract contact info
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Crawl result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrawlResult"

  # ── Email Accounts ───────────────────────────────────────────
  /email-accounts:
    get:
      operationId: listEmailAccounts
      tags: [email-accounts]
      summary: List all email accounts
      responses:
        "200":
          description: List of email accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmailAccount"
    post:
      operationId: createEmailAccount
      tags: [email-accounts]
      summary: Create an email account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailAccountInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAccount"

  /email-accounts/{id}:
    patch:
      operationId: updateEmailAccount
      tags: [email-accounts]
      summary: Update an email account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailAccountPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAccount"
    delete:
      operationId: deleteEmailAccount
      tags: [email-accounts]
      summary: Delete an email account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /email-accounts/{id}/test:
    post:
      operationId: testEmailAccount
      tags: [email-accounts]
      summary: Test SMTP connection for an email account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmtpTestResult"

  /campaigns/{id}/email-accounts:
    get:
      operationId: listCampaignEmailAccounts
      tags: [email-accounts]
      summary: List email accounts assigned to a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of assigned email accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmailAccount"
    post:
      operationId: assignCampaignEmailAccount
      tags: [email-accounts]
      summary: Assign an email account to a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignEmailAccountInput"
      responses:
        "201":
          description: Assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignEmailAccountAssignment"

  /campaigns/{id}/email-accounts/{accountId}:
    delete:
      operationId: unassignCampaignEmailAccount
      tags: [email-accounts]
      summary: Remove an email account from a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  # ── Outreach Queue ───────────────────────────────────────────
  /outreach:
    get:
      operationId: listOutreach
      tags: [outreach]
      summary: List outreach queue items
      parameters:
        - name: campaignId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of outreach items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OutreachItem"
    post:
      operationId: queueLead
      tags: [outreach]
      summary: Queue a lead for outreach (generates subject/body from template)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueLeadInput"
      responses:
        "201":
          description: Queued item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachItem"

  /outreach/from-list:
    post:
      operationId: outreachFromList
      tags: [outreach]
      summary: Create outreach drafts for all leads in a list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutreachFromListInput"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkQueueResult"

  /outreach/bulk-queue:
    post:
      operationId: bulkQueueLeads
      tags: [outreach]
      summary: Queue multiple leads for outreach
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkQueueInput"
      responses:
        "200":
          description: Bulk queue result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkQueueResult"

  /outreach/bulk-approve:
    post:
      operationId: bulkApproveOutreach
      tags: [outreach]
      summary: Approve multiple outreach items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkApproveInput"
      responses:
        "200":
          description: Bulk approve result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkApproveResult"

  /outreach/bulk-reject:
    post:
      operationId: bulkRejectOutreach
      tags: [outreach]
      summary: Reject multiple outreach items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkApproveInput"
      responses:
        "200":
          description: Bulk reject result
          content:
            application/json:
              schema:
                type: object
                properties:
                  rejected:
                    type: integer

  /outreach/{id}:
    patch:
      operationId: updateOutreach
      tags: [outreach]
      summary: Update an outreach item (subject, body, status, email account)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutreachPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachItem"
    delete:
      operationId: deleteOutreach
      tags: [outreach]
      summary: Remove an item from the queue
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /outreach/{id}/approve:
    post:
      operationId: approveOutreach
      tags: [outreach]
      summary: Approve a single outreach item for sending
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Approved item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachItem"

  /outreach/{id}/reject:
    post:
      operationId: rejectOutreach
      tags: [outreach]
      summary: Reject a single outreach item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectOutreachInput"
      responses:
        "200":
          description: Rejected item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachItem"

  /outreach/{id}/regenerate:
    post:
      operationId: regenerateOutreach
      tags: [outreach]
      summary: Regenerate email content for a draft outreach item using AI
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegenerateOutreachInput"
      responses:
        "200":
          description: Regenerated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachItem"

  /outreach/{id}/send:
    post:
      operationId: sendOutreachItem
      tags: [outreach]
      summary: Send a single approved outreach item now
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Send result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachItem"

  /outreach/{id}/retry:
    post:
      operationId: retryOutreachItem
      tags: [outreach]
      summary: Retry a failed or bounced outreach item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Retry result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachItem"

  /outreach/send-batch:
    post:
      operationId: sendOutreachBatch
      tags: [outreach]
      summary: Send all approved outreach items respecting campaign and account daily limits
      responses:
        "200":
          description: Batch send result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendBatchResult"

  /outreach/send-test:
    post:
      operationId: sendTestEmail
      tags: [outreach]
      summary: Send a test email using a configured email account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendTestInput"
      responses:
        "200":
          description: Test send result
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string

  /outreach/send-stats:
    get:
      operationId: getSendStats
      tags: [outreach]
      summary: Get daily send statistics for campaigns and accounts
      responses:
        "200":
          description: Send stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendStats"

  # ── Logs ─────────────────────────────────────────────────────
  /logs:
    get:
      operationId: listLogs
      tags: [logs]
      summary: List activity logs
      parameters:
        - name: campaignId
          in: query
          schema:
            type: integer
        - name: type
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: List of logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LogEntry"

  # ── Settings ─────────────────────────────────────────────────
  /settings/test-ai:
    post:
      operationId: testAIConnection
      tags: [settings]
      summary: Test AI (OpenAI) connection
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestAIResult"

  /settings:
    get:
      operationId: listSettings
      tags: [settings]
      summary: List all app settings
      responses:
        "200":
          description: Settings list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppSetting"

  /settings/{key}:
    put:
      operationId: upsertSetting
      tags: [settings]
      summary: Set an app setting value
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppSettingInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSetting"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    DashboardStats:
      type: object
      required:
        - totalCampaigns
        - activeCampaigns
        - totalLeads
        - leadsToReview
        - emailsQueued
        - emailsSentToday
        - pendingReview
        - approvedToSend
        - rejectedDrafts
        - riskyQueued
        - listsReadyForOutreach
      properties:
        totalCampaigns:
          type: integer
        activeCampaigns:
          type: integer
        totalLeads:
          type: integer
        leadsToReview:
          type: integer
        emailsQueued:
          type: integer
        emailsSentToday:
          type: integer
        pendingReview:
          type: integer
        approvedToSend:
          type: integer
        rejectedDrafts:
          type: integer
        riskyQueued:
          type: integer
        listsReadyForOutreach:
          type: integer

    Campaign:
      type: object
      required:
        - id
        - name
        - objective
        - isActive
        - minRelevanceScore
        - maxSearchesPerDay
        - maxLeadsPerDay
        - maxEmailsPerDay
        - resultsPerSearch
        - queryRefreshDays
        - discoverySourceRefreshDays
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        name:
          type: string
        objective:
          type: string
        isActive:
          type: boolean
        minRelevanceScore:
          type: integer
        maxSearchesPerDay:
          type: integer
        maxLeadsPerDay:
          type: integer
        maxEmailsPerDay:
          type: integer
        resultsPerSearch:
          type: integer
          default: 10
          description: Number of Serper search results requested per keyword-country query (10/20/30/50)
        queryRefreshDays:
          type: integer
          default: 30
          description: Days before the same keyword-country query is searched again
        discoverySourceRefreshDays:
          type: integer
          default: 30
          description: Days before a previously mined discovery source URL is mined again
        subjectTemplate:
          type: ["string", "null"]
        emailTemplate:
          type: ["string", "null"]
        unsubscribeFooter:
          type: ["string", "null"]
        keywords:
          type: array
          items:
            type: string
        countries:
          type: array
          items:
            type: string
        scheduleType:
          type: string
          enum: [manual, daily, weekly]
          default: manual
        scheduleDays:
          type: ["string", "null"]
        scheduleTime:
          type: ["string", "null"]
        nextRunAt:
          type: ["string", "null"]
        lastRunAt:
          type: ["string", "null"]
        lastRunStatus:
          type: string
          enum: [idle, running, success, failed]
        isPaused:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string

    CampaignInput:
      type: object
      required: [name, objective]
      properties:
        name:
          type: string
          minLength: 1
        objective:
          type: string
        isActive:
          type: boolean
          default: true
        minRelevanceScore:
          type: integer
          default: 50
        maxSearchesPerDay:
          type: integer
          default: 100
        maxLeadsPerDay:
          type: integer
          default: 50
        maxEmailsPerDay:
          type: integer
          default: 20
        resultsPerSearch:
          type: integer
          default: 10
          minimum: 1
          maximum: 50
          description: Number of Serper search results requested per keyword-country query (10/20/30/50)
        queryRefreshDays:
          type: integer
          default: 30
          minimum: 1
          description: Days before the same keyword-country query is searched again
        discoverySourceRefreshDays:
          type: integer
          default: 30
          minimum: 1
          description: Days before a previously mined discovery source URL is mined again
        subjectTemplate:
          type: string
        emailTemplate:
          type: string
        unsubscribeFooter:
          type: string
        keywords:
          type: array
          items:
            type: string
        countries:
          type: array
          items:
            type: string
        scheduleType:
          type: string
          enum: [manual, daily, weekly]
        scheduleDays:
          type: string
        scheduleTime:
          type: string
        isPaused:
          type: boolean

    CampaignPatch:
      type: object
      properties:
        name:
          type: string
        objective:
          type: string
        isActive:
          type: boolean
        minRelevanceScore:
          type: integer
        maxSearchesPerDay:
          type: integer
        maxLeadsPerDay:
          type: integer
        maxEmailsPerDay:
          type: integer
        resultsPerSearch:
          type: integer
          minimum: 1
          maximum: 50
          description: Number of Serper search results requested per keyword-country query (10/20/30/50)
        queryRefreshDays:
          type: integer
          minimum: 1
          description: Days before the same keyword-country query is searched again
        discoverySourceRefreshDays:
          type: integer
          minimum: 1
          description: Days before a previously mined discovery source URL is mined again
        subjectTemplate:
          type: ["string", "null"]
        emailTemplate:
          type: ["string", "null"]
        unsubscribeFooter:
          type: ["string", "null"]
        keywords:
          type: array
          items:
            type: string
        countries:
          type: array
          items:
            type: string
        scheduleType:
          type: string
          enum: [manual, daily, weekly]
        scheduleDays:
          type: ["string", "null"]
        scheduleTime:
          type: ["string", "null"]
        isPaused:
          type: boolean

    SchedulerStatus:
      type: object
      required: [campaignId, campaignName, scheduleType, isPaused, lastRunStatus]
      properties:
        campaignId:
          type: integer
        campaignName:
          type: string
        scheduleType:
          type: string
        scheduleDays:
          type: ["string", "null"]
        scheduleTime:
          type: ["string", "null"]
        nextRunAt:
          type: ["string", "null"]
        lastRunAt:
          type: ["string", "null"]
        lastRunStatus:
          type: string
        isPaused:
          type: boolean
        isActive:
          type: boolean

    TriggerResult:
      type: object
      required: [status, campaignId]
      properties:
        status:
          type: string
        campaignId:
          type: integer
        runId:
          type: integer
          description: ID of the campaign_runs record created for this pipeline execution

    PipelineResult:
      type: object
      required: [campaignId, discoveryLeadsCreated, crawledCount, scoredCount, emailsSent, skipped, failed]
      properties:
        campaignId:
          type: integer
        discoveryLeadsCreated:
          type: integer
        crawledCount:
          type: integer
        scoredCount:
          type: integer
        emailsSent:
          type: integer
        skipped:
          type: integer
        failed:
          type: integer
        durationMs:
          type: integer
        errors:
          type: array
          items:
            type: string

    Lead:
      type: object
      required:
        - id
        - campaignId
        - companyName
        - rootDomain
        - websiteUrl
        - leadStatus
        - reviewStatus
        - qualificationStatus
        - outreachStatus
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        campaignId:
          type: integer
        campaignRunId:
          type: ["integer", "null"]
        companyName:
          type: string
        rootDomain:
          type: string
        websiteUrl:
          type: string
        country:
          type: ["string", "null"]
        emails:
          type: ["string", "null"]
        phoneNumbers:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        linkedinUrl:
          type: ["string", "null"]
        relevanceScore:
          type: ["integer", "null"]
        relevanceReason:
          type: ["string", "null"]
        scoringMethod:
          type: ["string", "null"]
          description: '"ai" = scored by OpenAI, "keyword_fallback" = rule-based, null = not yet scored'
        contactQuality:
          type: ["string", "null"]
        leadStatus:
          type: string
        reviewStatus:
          type: string
        qualificationStatus:
          type: string
          enum: [unqualified, qualified, rejected]
          default: unqualified
        outreachStatus:
          type: string
          enum: [not_queued, queued, contacted, followup_sent, closed]
          default: not_queued
        emailStatus:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        sourceKeyword:
          type: ["string", "null"]
        sourceCountry:
          type: ["string", "null"]
        sourceQuery:
          type: ["string", "null"]
        sourceType:
          type: ["string", "null"]
          description: '"direct" = came from search result, "mined" = extracted from a discovery source page'
        discoverySourceDomain:
          type: ["string", "null"]
          description: Root domain of the listicle/directory page this lead was mined from
        discoverySourceUrl:
          type: ["string", "null"]
          description: Full URL of the discovery source page this lead was extracted from
        crawlStatus:
          type: ["string", "null"]
        crawlError:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    LeadInput:
      type: object
      required: [campaignId, companyName, rootDomain, websiteUrl]
      properties:
        campaignId:
          type: integer
        companyName:
          type: string
        rootDomain:
          type: string
        websiteUrl:
          type: string
        country:
          type: string
        emails:
          type: string
        phoneNumbers:
          type: string
        address:
          type: string
        linkedinUrl:
          type: string
        relevanceScore:
          type: integer
        relevanceReason:
          type: string
        scoringMethod:
          type: string
        contactQuality:
          type: string
        leadStatus:
          type: string
          default: new
        reviewStatus:
          type: string
          default: pending
        notes:
          type: string
        sourceKeyword:
          type: string
        sourceCountry:
          type: string
        sourceQuery:
          type: string
        sourceType:
          type: string
        discoverySourceDomain:
          type: string
        discoverySourceUrl:
          type: string

    LeadPatch:
      type: object
      properties:
        companyName:
          type: string
        country:
          type: string
        emails:
          type: ["string", "null"]
        phoneNumbers:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        linkedinUrl:
          type: ["string", "null"]
        relevanceScore:
          type: ["integer", "null"]
        relevanceReason:
          type: ["string", "null"]
        scoringMethod:
          type: ["string", "null"]
        contactQuality:
          type: ["string", "null"]
        leadStatus:
          type: string
        reviewStatus:
          type: string
        qualificationStatus:
          type: string
          enum: [unqualified, qualified, rejected]
        outreachStatus:
          type: string
          enum: [not_queued, queued, contacted, followup_sent, closed]
        emailStatus:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    EmailAccount:
      type: object
      required:
        - id
        - name
        - senderName
        - email
        - smtpHost
        - smtpPort
        - smtpUser
        - dailySendLimit
        - isActive
        - totalSent
        - sentToday
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        name:
          type: string
        senderName:
          type: string
        email:
          type: string
        smtpHost:
          type: string
        smtpPort:
          type: integer
        smtpSecure:
          type: boolean
        smtpUser:
          type: string
        dailySendLimit:
          type: integer
        isActive:
          type: boolean
        totalSent:
          type: integer
        sentToday:
          type: integer
        lastSentAt:
          type: ["string", "null"]
        lastTestedAt:
          type: ["string", "null"]
        lastTestResult:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    EmailAccountInput:
      type: object
      required: [name, senderName, email, smtpHost, smtpPort, smtpUser, smtpPassword]
      properties:
        name:
          type: string
        senderName:
          type: string
        email:
          type: string
        smtpHost:
          type: string
        smtpPort:
          type: integer
          default: 587
        smtpSecure:
          type: boolean
          default: false
        smtpUser:
          type: string
        smtpPassword:
          type: string
        dailySendLimit:
          type: integer
          default: 50
        isActive:
          type: boolean
          default: true

    EmailAccountPatch:
      type: object
      properties:
        name:
          type: string
        senderName:
          type: string
        email:
          type: string
        smtpHost:
          type: string
        smtpPort:
          type: integer
        smtpSecure:
          type: boolean
        smtpUser:
          type: string
        smtpPassword:
          type: string
        dailySendLimit:
          type: integer
        isActive:
          type: boolean

    CampaignEmailAccountInput:
      type: object
      required: [emailAccountId]
      properties:
        emailAccountId:
          type: integer

    CampaignEmailAccountAssignment:
      type: object
      required: [id, campaignId, emailAccountId]
      properties:
        id:
          type: integer
        campaignId:
          type: integer
        emailAccountId:
          type: integer

    SmtpTestResult:
      type: object
      required: [success, message, testedAt]
      properties:
        success:
          type: boolean
        message:
          type: string
        testedAt:
          type: string

    OutreachItem:
      type: object
      required:
        - id
        - leadId
        - recipientEmail
        - subject
        - body
        - status
        - aiPersonalized
        - retryCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        campaignId:
          type: ["integer", "null"]
        leadId:
          type: integer
        emailAccountId:
          type: ["integer", "null"]
        emailTemplateId:
          type: ["integer", "null"]
        listId:
          type: ["integer", "null"]
        recipientEmail:
          type: string
        subject:
          type: string
        body:
          type: string
        status:
          type: string
          enum: [pending_review, approved, rejected, sent, failed, bounced, draft, queued]
        aiPersonalized:
          type: boolean
        failureReason:
          type: ["string", "null"]
        retryCount:
          type: integer
        approvedAt:
          type: ["string", "null"]
        rejectedAt:
          type: ["string", "null"]
        scheduledAt:
          type: ["string", "null"]
        sentAt:
          type: ["string", "null"]
        bouncedAt:
          type: ["string", "null"]
        companyName:
          type: ["string", "null"]
        campaignName:
          type: ["string", "null"]
        listName:
          type: ["string", "null"]
        templateName:
          type: ["string", "null"]
        senderEmail:
          type: ["string", "null"]
        relevanceScore:
          type: ["integer", "null"]
        qualificationStatus:
          type: ["string", "null"]
        qualityWarnings:
          type: array
          items:
            $ref: "#/components/schemas/QualityWarning"
        recipientEmailType:
          type: string
          enum: [generic, noreply, personal, unknown]
        createdAt:
          type: string
        updatedAt:
          type: string

    OutreachPatch:
      type: object
      properties:
        subject:
          type: string
        body:
          type: string
        status:
          type: string
        emailAccountId:
          type: ["integer", "null"]
        scheduledAt:
          type: ["string", "null"]

    RejectOutreachInput:
      type: object
      properties:
        reason:
          type: string

    RegenerateOutreachInput:
      type: object
      properties:
        forceAi:
          type: boolean

    QualityWarning:
      type: object
      required: [code, severity, message]
      properties:
        code:
          type: string
        severity:
          type: string
          enum: [error, warning, info]
        message:
          type: string

    ListHealthResponse:
      type: object
      required:
        - totalLeads
        - leadsWithEmail
        - leadsWithoutEmail
        - qualifiedLeads
        - rejectedLeads
        - aiPersonalizedDrafts
        - duplicateEmails
        - riskyEmails
        - genericEmails
        - pendingReviewDrafts
        - approvedDrafts
      properties:
        totalLeads:
          type: integer
        leadsWithEmail:
          type: integer
        leadsWithoutEmail:
          type: integer
        qualifiedLeads:
          type: integer
        rejectedLeads:
          type: integer
        aiPersonalizedDrafts:
          type: integer
        duplicateEmails:
          type: integer
        riskyEmails:
          type: integer
        genericEmails:
          type: integer
