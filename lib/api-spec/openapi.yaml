openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Lead Intelligence Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: campaigns
  - name: leads
  - name: email-accounts
  - name: outreach
  - name: logs
  - name: settings
  - name: dashboard

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Dashboard ────────────────────────────────────────────────
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  # ── Campaigns ────────────────────────────────────────────────
  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      summary: List all campaigns
      responses:
        "200":
          description: List of campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"
    post:
      operationId: createCampaign
      tags: [campaigns]
      summary: Create a campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"

  /campaigns/{id}:
    get:
      operationId: getCampaign
      tags: [campaigns]
      summary: Get a campaign by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "404":
          description: Not found
    patch:
      operationId: updateCampaign
      tags: [campaigns]
      summary: Update a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
    delete:
      operationId: deleteCampaign
      tags: [campaigns]
      summary: Delete a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Discovery ────────────────────────────────────────────────
  /campaigns/{id}/run-discovery:
    post:
      operationId: runDiscovery
      tags: [campaigns]
      summary: Run web discovery for a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Discovery summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverySummary"
        "400":
          description: Campaign inactive or missing API key
        "404":
          description: Campaign not found

  # ── Leads ────────────────────────────────────────────────────
  /leads:
    get:
      operationId: listLeads
      tags: [leads]
      summary: List leads (optionally filter by campaign)
      parameters:
        - name: campaignId
          in: query
          schema:
            type: integer
        - name: reviewStatus
          in: query
          schema:
            type: string
        - name: leadStatus
          in: query
          schema:
            type: string
        - name: hasEmail
          in: query
          schema:
            type: boolean
        - name: minScore
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
    post:
      operationId: createLead
      tags: [leads]
      summary: Create a lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"

  /leads/{id}:
    get:
      operationId: getLead
      tags: [leads]
      summary: Get a lead by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "404":
          description: Not found
    patch:
      operationId: updateLead
      tags: [leads]
      summary: Update a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
    delete:
      operationId: deleteLead
      tags: [leads]
      summary: Delete a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /leads/bulk-action:
    post:
      operationId: bulkLeadAction
      tags: [leads]
      summary: Bulk apply a status action to multiple leads
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkActionInput"
      responses:
        "200":
          description: Bulk action result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkActionResult"

  /leads/{id}/notes:
    get:
      operationId: listLeadNotes
      tags: [leads]
      summary: List notes for a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeadNote"
    post:
      operationId: addLeadNote
      tags: [leads]
      summary: Add a note to a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadNoteInput"
      responses:
        "201":
          description: Created note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadNote"

  /leads/{id}/status-history:
    get:
      operationId: getLeadStatusHistory
      tags: [leads]
      summary: Get status change history for a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of status history entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatusHistoryEntry"

  /leads/bulk-score:
    post:
      operationId: bulkScore
      tags: [leads]
      summary: Score multiple leads by ID list or campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkScoreInput"
      responses:
        "200":
          description: Bulk score summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkScoreSummary"

  /leads/{id}/score:
    post:
      operationId: scoreLead
      tags: [leads]
      summary: Score a single lead against campaign objective using AI
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Score result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreResult"

  /leads/bulk-crawl:
    post:
      operationId: bulkCrawl
      tags: [leads]
      summary: Crawl multiple leads by ID list or campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkCrawlInput"
      responses:
        "200":
          description: Bulk crawl summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkCrawlSummary"

  /leads/{id}/run-crawl:
    post:
      operationId: runCrawl
      tags: [leads]
      summary: Crawl a single lead's website and extract contact info
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Crawl result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrawlResult"

  # ── Email Accounts ───────────────────────────────────────────
  /email-accounts:
    get:
      operationId: listEmailAccounts
      tags: [email-accounts]
      summary: List all email accounts
      responses:
        "200":
          description: List of email accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmailAccount"
    post:
      operationId: createEmailAccount
      tags: [email-accounts]
      summary: Create an email account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailAccountInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAccount"

  /email-accounts/{id}:
    patch:
      operationId: updateEmailAccount
      tags: [email-accounts]
      summary: Update an email account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailAccountPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAccount"
    delete:
      operationId: deleteEmailAccount
      tags: [email-accounts]
      summary: Delete an email account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /email-accounts/{id}/test:
    post:
      operationId: testEmailAccount
      tags: [email-accounts]
      summary: Test SMTP connection for an email account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmtpTestResult"

  /campaigns/{id}/email-accounts:
    get:
      operationId: listCampaignEmailAccounts
      tags: [email-accounts]
      summary: List email accounts assigned to a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of assigned email accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmailAccount"
    post:
      operationId: assignCampaignEmailAccount
      tags: [email-accounts]
      summary: Assign an email account to a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignEmailAccountInput"
      responses:
        "201":
          description: Assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignEmailAccountAssignment"

  /campaigns/{id}/email-accounts/{accountId}:
    delete:
      operationId: unassignCampaignEmailAccount
      tags: [email-accounts]
      summary: Remove an email account from a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  # ── Outreach Queue ───────────────────────────────────────────
  /outreach:
    get:
      operationId: listOutreach
      tags: [outreach]
      summary: List outreach queue items
      parameters:
        - name: campaignId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of outreach items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OutreachItem"
    post:
      operationId: queueLead
      tags: [outreach]
      summary: Queue a lead for outreach (generates subject/body from template)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueLeadInput"
      responses:
        "201":
          description: Queued item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachItem"

  /outreach/bulk-queue:
    post:
      operationId: bulkQueueLeads
      tags: [outreach]
      summary: Queue multiple leads for outreach
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkQueueInput"
      responses:
        "200":
          description: Bulk queue result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkQueueResult"

  /outreach/bulk-approve:
    post:
      operationId: bulkApproveOutreach
      tags: [outreach]
      summary: Approve multiple outreach items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkApproveInput"
      responses:
        "200":
          description: Bulk approve result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkApproveResult"

  /outreach/{id}:
    patch:
      operationId: updateOutreach
      tags: [outreach]
      summary: Update an outreach item (subject, body, status, email account)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutreachPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachItem"
    delete:
      operationId: deleteOutreach
      tags: [outreach]
      summary: Remove an item from the queue
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /outreach/{id}/approve:
    post:
      operationId: approveOutreach
      tags: [outreach]
      summary: Approve a single outreach item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Approved item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachItem"

  # ── Logs ─────────────────────────────────────────────────────
  /logs:
    get:
      operationId: listLogs
      tags: [logs]
      summary: List activity logs
      parameters:
        - name: campaignId
          in: query
          schema:
            type: integer
        - name: type
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: List of logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LogEntry"

  # ── Settings ─────────────────────────────────────────────────
  /settings:
    get:
      operationId: listSettings
      tags: [settings]
      summary: List all app settings
      responses:
        "200":
          description: Settings list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppSetting"

  /settings/{key}:
    put:
      operationId: upsertSetting
      tags: [settings]
      summary: Set an app setting value
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppSettingInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSetting"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    DashboardStats:
      type: object
      required:
        - totalCampaigns
        - activeCampaigns
        - totalLeads
        - leadsToReview
        - emailsQueued
        - emailsSentToday
      properties:
        totalCampaigns:
          type: integer
        activeCampaigns:
          type: integer
        totalLeads:
          type: integer
        leadsToReview:
          type: integer
        emailsQueued:
          type: integer
        emailsSentToday:
          type: integer

    Campaign:
      type: object
      required:
        - id
        - name
        - objective
        - isActive
        - minRelevanceScore
        - maxSearchesPerDay
        - maxLeadsPerDay
        - maxEmailsPerDay
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        name:
          type: string
        objective:
          type: string
        isActive:
          type: boolean
        minRelevanceScore:
          type: integer
        maxSearchesPerDay:
          type: integer
        maxLeadsPerDay:
          type: integer
        maxEmailsPerDay:
          type: integer
        subjectTemplate:
          type: ["string", "null"]
        emailTemplate:
          type: ["string", "null"]
        unsubscribeFooter:
          type: ["string", "null"]
        keywords:
          type: array
          items:
            type: string
        countries:
          type: array
          items:
            type: string
        createdAt:
          type: string
        updatedAt:
          type: string

    CampaignInput:
      type: object
      required: [name, objective]
      properties:
        name:
          type: string
          minLength: 1
        objective:
          type: string
        isActive:
          type: boolean
          default: true
        minRelevanceScore:
          type: integer
          default: 50
        maxSearchesPerDay:
          type: integer
          default: 100
        maxLeadsPerDay:
          type: integer
          default: 50
        maxEmailsPerDay:
          type: integer
          default: 20
        subjectTemplate:
          type: string
        emailTemplate:
          type: string
        unsubscribeFooter:
          type: string
        keywords:
          type: array
          items:
            type: string
        countries:
          type: array
          items:
            type: string

    CampaignPatch:
      type: object
      properties:
        name:
          type: string
        objective:
          type: string
        isActive:
          type: boolean
        minRelevanceScore:
          type: integer
        maxSearchesPerDay:
          type: integer
        maxLeadsPerDay:
          type: integer
        maxEmailsPerDay:
          type: integer
        subjectTemplate:
          type: ["string", "null"]
        emailTemplate:
          type: ["string", "null"]
        unsubscribeFooter:
          type: ["string", "null"]
        keywords:
          type: array
          items:
            type: string
        countries:
          type: array
          items:
            type: string

    Lead:
      type: object
      required:
        - id
        - campaignId
        - companyName
        - rootDomain
        - websiteUrl
        - leadStatus
        - reviewStatus
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        campaignId:
          type: integer
        companyName:
          type: string
        rootDomain:
          type: string
        websiteUrl:
          type: string
        country:
          type: ["string", "null"]
        emails:
          type: ["string", "null"]
        phoneNumbers:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        linkedinUrl:
          type: ["string", "null"]
        relevanceScore:
          type: ["integer", "null"]
        relevanceReason:
          type: ["string", "null"]
        contactQuality:
          type: ["string", "null"]
        leadStatus:
          type: string
        reviewStatus:
          type: string
        emailStatus:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        sourceKeyword:
          type: ["string", "null"]
        sourceCountry:
          type: ["string", "null"]
        sourceQuery:
          type: ["string", "null"]
        crawlStatus:
          type: ["string", "null"]
        crawlError:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    LeadInput:
      type: object
      required: [campaignId, companyName, rootDomain, websiteUrl]
      properties:
        campaignId:
          type: integer
        companyName:
          type: string
        rootDomain:
          type: string
        websiteUrl:
          type: string
        country:
          type: string
        emails:
          type: string
        phoneNumbers:
          type: string
        address:
          type: string
        linkedinUrl:
          type: string
        relevanceScore:
          type: integer
        relevanceReason:
          type: string
        contactQuality:
          type: string
        leadStatus:
          type: string
          default: new
        reviewStatus:
          type: string
          default: pending
        notes:
          type: string
        sourceKeyword:
          type: string
        sourceCountry:
          type: string
        sourceQuery:
          type: string

    LeadPatch:
      type: object
      properties:
        companyName:
          type: string
        country:
          type: string
        emails:
          type: ["string", "null"]
        phoneNumbers:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        linkedinUrl:
          type: ["string", "null"]
        relevanceScore:
          type: ["integer", "null"]
        relevanceReason:
          type: ["string", "null"]
        contactQuality:
          type: ["string", "null"]
        leadStatus:
          type: string
        reviewStatus:
          type: string
        emailStatus:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    EmailAccount:
      type: object
      required:
        - id
        - name
        - senderName
        - email
        - smtpHost
        - smtpPort
        - smtpUser
        - dailySendLimit
        - isActive
        - totalSent
        - sentToday
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        name:
          type: string
        senderName:
          type: string
        email:
          type: string
        smtpHost:
          type: string
        smtpPort:
          type: integer
        smtpSecure:
          type: boolean
        smtpUser:
          type: string
        dailySendLimit:
          type: integer
        isActive:
          type: boolean
        totalSent:
          type: integer
        sentToday:
          type: integer
        lastSentAt:
          type: ["string", "null"]
        lastTestedAt:
          type: ["string", "null"]
        lastTestResult:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    EmailAccountInput:
      type: object
      required: [name, senderName, email, smtpHost, smtpPort, smtpUser, smtpPassword]
      properties:
        name:
          type: string
        senderName:
          type: string
        email:
          type: string
        smtpHost:
          type: string
        smtpPort:
          type: integer
          default: 587
        smtpSecure:
          type: boolean
          default: false
        smtpUser:
          type: string
        smtpPassword:
          type: string
        dailySendLimit:
          type: integer
          default: 50
        isActive:
          type: boolean
